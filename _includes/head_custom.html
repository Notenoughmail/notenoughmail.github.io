<link rel="alternate" type="application/rss+xml" title=" » Writing" href="{{ site.url }}/writing/feed.xml" />
<link rel="alternate" type="application/rss+xml" title=" » Updates" href="{{ site.url }}/feed.xml" />

{% if page.thin_media %}
<style>
    @media (min-width: 50rem) {
        .main {
            max-width: 40rem;
        }
    }
</style>
{% endif %}

{% if page.extra_header %}
    {% include {{ page.extra_header }}.html %}
{% endif %}

{% if layout.discord_preview %}<script id="discord:component-embed" type="application/json">{
    "component": {
        "type": 9,
        "components": [
            {
                "type": 10,
                "content": "{{ page.content }}"
            }
        ],
        "accessory": {
            "type": 11,
            "media": {
                "url": "{{ site.url }}/assets/icon/{{ layout.icon }}.png"
            }
        }
    }
}</script>{% endif %}
